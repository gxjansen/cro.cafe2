name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Run after content sync workflows
  workflow_run:
    workflows: ["Sync Episodes from NocoDB"]
    types:
      - completed

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check episode content exists
      run: |
        echo "Checking for episode content..."
        find src/content/episodes -name "*.mdx" | wc -l || echo "0"
        echo "Episode files found: $(find src/content/episodes -name "*.mdx" | wc -l || echo "0")"
        
    - name: Run general tests
      run: npm run test:run
      continue-on-error: true
      
    - name: Run episode validation tests with better error handling
      run: |
        echo "Running episode frontmatter validation..."
        episode_count=$(find src/content/episodes -name "*.mdx" | wc -l || echo "0")
        if [ "$episode_count" -eq 0 ]; then
          echo "⚠️ No episode files found - skipping episode validation tests"
          echo "This likely means content hasn't been synced yet"
          exit 0
        else
          echo "Found $episode_count episode files - running validation"
          npm run test:run -- tests/unit/episode-frontmatter-validation.test.ts
        fi
      
    # If tests fail, provide detailed error message
    - name: Report test failures
      if: failure()
      run: |
        echo "❌ Tests failed!"
        echo "Episode count: $(find src/content/episodes -name "*.mdx" | wc -l || echo "0")"
        echo "Check the test output above for details."
        echo "If episode count is 0, this may be a content sync timing issue."